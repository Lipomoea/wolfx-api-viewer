<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>P-Alert 推算渲染检查</title>
<style>
    body { margin: 0; background: #20242b; color: white; font: 14px sans-serif; }
    nav { display: flex; gap: 12px; align-items: center; padding: 12px; }
    button { padding: 6px 12px; }
    #map { height: calc(100vh - 64px); background: #303945; }
</style>
<nav>
    <button id="run">运行合成事件</button>
    <button id="basic">基本标签</button>
    <button id="details">详细标签</button>
    <button id="cwa">切换匹配的 CWA 预警</button>
    <button id="always">切换不自动隐藏</button>
    <button id="clear">清空</button>
    <button id="unmount">卸载组件</button>
    <span id="status">等待检查</span>
</nav>
<div id="map"></div>
<div id="app"></div>
<script type="module">
    import L from 'leaflet'
    import 'leaflet/dist/leaflet.css'
    import { createApp, markRaw, nextTick, reactive, ref, watch } from 'vue'
    import { createPinia } from 'pinia'
    import PalertNet from '/src/components/components/PalertNet.vue'
    import Palert from '/src/classes/Palert.js'
    import { useSettingsStore } from '/src/stores/settings.js'
    import { useStatusStore } from '/src/stores/status.js'
    import { useAccessStore } from '/src/stores/access.js'
    import { calcDistanceKm, calcReachTime, getPalertLevelFromPgaPgv, stampToTime } from '/src/utils/Utils.js'
    import travelTimes from '/src/utils/TravelTimes.js'
    const map = L.map('map', { center: [24, 121], zoom: 8 })
    map.createPane('eewMarkerPane')
    map.getPane('eewMarkerPane').style.zIndex = 200
    map.createPane('wavePane')
    map.getPane('wavePane').style.zIndex = 150
    const status = document.querySelector('#status')
    const stamp = Date.UTC(2026, 8, 8, 0, 0, 0)
    let frameStamp = stamp + 20000
    let eventOriginStamp = stamp
    let running = false
    const stationList = Array.from({ length: 20 }, (_, i) => {
        const stationId = `W${i}`
        const latLng = [24 + Math.cos(i * 2.39996) * (0.04 + i * 0.01), 121 + Math.sin(i * 2.39996) * (0.04 + i * 0.01)]
        const distance = calcDistanceKm([24, 121], latLng)
        const triggerStamp = stamp + Math.round(calcReachTime(travelTimes.jma2001, true, 30, distance)) * 1000
        L.circleMarker(latLng, { radius: 3, weight: 1, color: '#ffffff', fillOpacity: 0.7 }).addTo(map)
        return { station: stationId, lat: latLng[0], lon: latLng[1], triggerStamp }
    })
    // Replace only the station-data service. Mount the production component and use its real Worker and layers.
    Palert.getStationList = async () => ({ version: 'synthetic', staInfos: stationList })
    Palert.getRealtimeData = async () => ({
        timestamp: running ? frameStamp += 1000 : frameStamp,
        dataVals: Object.fromEntries(stationList.map(info => [info.station, running ? 8 : 0.2]))
    })
    const pinia = createPinia()
    const settings = useSettingsStore(pinia)
    const statusStore = useStatusStore(pinia)
    useAccessStore(pinia).grant('advancedHypoInf')
    Object.assign(settings.mainSettings.displaySeisNet, { palertNet: true, palertHypoInf: true, palertHypoInfTextInfo: 1 })
    Object.assign(settings.mainSettings.onShake, { sound: false, notification: false, focus: false })
    statusStore.map = markRaw(map)
    let stations
    const activeEewList = reactive([])
    const app = createApp(PalertNet)
    app.use(pinia)
    app.provide('taiwanSeisNetLayers', {
        registerSource(source, value) { stations = value; return () => {} },
        redrawStations() {}
    })
    for(const name of ['palertMaxShindo', 'palertUpdateTime', 'palertPeriodMaxShindo', 'palertPeriodBarClass']) app.provide(name, ref(null))
    app.provide('handleTempEqlists', () => {})
    app.provide('activeEewList', activeEewList)
    app.mount('#app')
    watch(() => statusStore.isActive.palertInfHypo, active => {
        status.textContent = active ? '已显示推算震源' : '已清空'
    })
    document.querySelector('#run').onclick = async () => {
        if(Object.keys(stations).length !== stationList.length) return
        running = false
        settings.mainSettings.displaySeisNet.palertHypoInf = false
        await nextTick()
        eventOriginStamp = frameStamp - 20000
        activeEewList.length = 0
        for(const info of stationList) {
            const station = stations[info.station]
            station.clearHistory(false)
            for(let offset = -39; offset <= 20; offset++) {
                const timestamp = eventOriginStamp + offset * 1000
                const pga = timestamp >= eventOriginStamp + info.triggerStamp - stamp ? 8 : 0.2
                station.update({ timestamp, pga, pgv: null, level: getPalertLevelFromPgaPgv(pga, null) }, 0, false)
            }
            station.setActive()
        }
        status.textContent = '等待下一帧推算'
        settings.mainSettings.displaySeisNet.palertHypoInf = true
        running = true
    }
    document.querySelector('#basic').onclick = () => { settings.mainSettings.displaySeisNet.palertHypoInfTextInfo = 1 }
    document.querySelector('#details').onclick = () => { settings.mainSettings.displaySeisNet.palertHypoInfTextInfo = 2 }
    document.querySelector('#cwa').onclick = () => {
        if(activeEewList.length) activeEewList.length = 0
        else activeEewList.push({ eqMessage: {
            source: 'cwaEew', lat: 24, lng: 121, depth: 30,
            originTime: stampToTime(eventOriginStamp, 8), timeZone: 8,
            isCanceled: false, isAssumption: false
        } })
    }
    document.querySelector('#always').onclick = () => {
        settings.mainSettings.displaySeisNet.palertHypoInfAlwaysOn = !settings.mainSettings.displaySeisNet.palertHypoInfAlwaysOn
    }
    document.querySelector('#clear').onclick = () => {
        running = false
        settings.mainSettings.displaySeisNet.palertHypoInf = false
    }
    document.querySelector('#unmount').onclick = () => {
        app.unmount()
        status.textContent = '组件已卸载'
        document.querySelectorAll('button').forEach(button => { button.disabled = true })
    }
    addEventListener('beforeunload', () => { app.unmount(); map.remove() })
</script>
</html>
